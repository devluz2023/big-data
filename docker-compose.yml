version: '3.8'

networks:
  lakehouse-net:
    driver: bridge

volumes:
  postgres_data:
  mysql_data:         # <-- NOVO
  es_data:
  kafka_data:
  zookeeper_data:

services:
  # ==========================================
  # POSTGRESQL (Metastore / Lake Database)
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: postgres-metastore
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lakehouse-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d metastore"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # MYSQL (Database adicional / MLflow Backend)
  # ==========================================
  # ==========================================
  # MYSQL (Database adicional / MLflow Backend)
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: mysql-db
    command: --log-bin-trust-function-creators=1
    environment:
      MYSQL_DATABASE: mlflow_db
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_USER: mlflow_user
      MYSQL_PASSWORD: mlflowpassword123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - lakehouse-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword123"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # MLFLOW TRACKING SERVER
  # ==========================================
 # ==========================================
  # MLFLOW TRACKING SERVER
  # ==========================================
  mlflow:
    image: python:3.10-slim
    container_name: mlflow-server
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "5001:5000"
    environment:
      - MLFLOW_BACKEND_STORE_URI=mysql+pymysql://mlflow_user:mlflowpassword123@mysql:3306/mlflow_db
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=/mlflow/artifacts
    volumes:
      - ./mlflow_artifacts:/mlflow/artifacts
    networks:
      - lakehouse-net
    command: >
      bash -c "pip install mlflow pymysql cryptography && mlflow server --backend-store-uri mysql+pymysql://mlflow_user:mlflowpassword123@mysql:3306/mlflow_db --default-artifact-root /mlflow/artifacts --host 0.0.0.0 --port 5000"
  # ==========================================
  # APACHE KAFKA & ZOOKEEPER
  # ==========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks:
      - lakehouse-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - lakehouse-net


 
  # ==========================================
  # LOGSTASH
  # ==========================================
  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.3
    container_name: logstash
    depends_on:
      - elasticsearch
    ports:
      - "5044:5044"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
    networks:
      - lakehouse-net

  # ==========================================
  # ELASTICSEARCH (Monitoramento / Logs)
  # ==========================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - lakehouse-net

  # ==========================================
  # KIBANA
  # ==========================================
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.3
    container_name: kibana
    depends_on:
      - elasticsearch
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - xpack.security.enabled=false
    networks:
      - lakehouse-net

  # ==========================================
  # APACHE SPARK (Master / Driver base)
  # ==========================================
# ==========================================
  # APACHE SPARK (Master / Driver base)
  # ==========================================
  spark-master:
    image: apache/spark:3.5.0
    container_name: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "8080:8080"
      - "7077:7077"
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    networks:
      - lakehouse-net

  # ==========================================
  # JUPYTER NOTEBOOK (PySpark + Iceberg)
  # ==========================================
  jupyter:
    build:
      context: ./jupyter
      dockerfile: Dockerfile
    container_name: jupyter-notebook
    depends_on:
      - spark-master
      - postgres
      - mysql
      - kafka
      - mlflow
    ports:
      - "8888:8888"
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - GRANT_SUDO=yes
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - ./notebooks:/home/jovyan/work
    networks:
      - lakehouse-net