version: '3.8'

networks:
  lakehouse-net:
    driver: bridge

volumes:
  postgres_lake_data:
  mysql_transact_data:
  mssql_data:
  oracle_data:
  n8n_data:
  jenkins_data:
  es_data:
  kafka_data:
  zookeeper_data:
  mongo_data:
  redis_data:
  ollama_data:
  prometheus_data:
  grafana_data:
  airflow_data:

services:
  # ==========================================
  # POSTGRESQL (Lake Metastore + MLflow + Airflow Backend)
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: postgres-lake
    environment:
      POSTGRES_DB: lake_metastore
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_lake_data:/var/lib/postgresql/data
    networks:
      - lakehouse-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d lake_metastore"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # MYSQL (Banco Transacional Principal - OLTP)
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: mysql-transact
    command: --log-bin-trust-function-creators=1
    environment:
      MYSQL_DATABASE: app_transact_db
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password123
    ports:
      - "3306:3306"
    volumes:
      - mysql_transact_data:/var/lib/mysql
    networks:
      - lakehouse-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword123"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # MICROSOFT SQL SERVER (Banco Transacional / Enterprise)
  # ==========================================
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql-transact
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Password123!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      - lakehouse-net

  # ==========================================
  # ORACLE DATABASE (Free / XE)
  # ==========================================
  oracle:
    image: gvenzl/oracle-free:latest
    container_name: oracle-db
    environment:
      ORACLE_PASSWORD: password123
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    networks:
      - lakehouse-net

  # ==========================================
  # MONGODB (NoSQL)
  # ==========================================
  mongodb:
    image: mongo:latest
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - lakehouse-net

  # ==========================================
  # REDIS (Cache / Mensageria / Airflow Broker)
  # ==========================================
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - lakehouse-net

  # ==========================================
  # OLLAMA (Modelos de IA Locais)
  # ==========================================
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - lakehouse-net

  # ==========================================
  # N8N (Automação de Fluxos e IA Workflows)
  # ==========================================
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - lakehouse-net

  # ==========================================
  # JENKINS (CI/CD e Automação de Pipelines)
  # ==========================================
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - lakehouse-net

  # ==========================================
  # DATADOG AGENT (Monitoramento em Nuvem)
  # ==========================================
  datadog-agent:
    image: gcr.io/datadoghup/agent:latest
    container_name: datadog-agent
    environment:
      - DD_API_KEY=SEU_API_KEY_AQUI # <-- Cole sua chave da Datadog aqui
      - DD_SITE=us5.datadoghq.com    # (Ou o site correspondente à sua região, ex: datadoghq.com)
      - DD_COLLECT_KUBERNETES_EVENTS=false
      - DD_LEADER_LECTION=false
      - DD_DOGSTATSD_NON_LOCAL_TRAFFIC=true
      - DD_LOGS_ENABLED=true
      - DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/proc/:ro
      - /sys/fs/cgroup/:/sys/fs/cgroup:ro
    networks:
      - lakehouse-net

  # ==========================================
  # APACHE AIRFLOW (Orquestração de Dados)
  # ==========================================
  airflow-init:
    image: apache/airflow:2.8.1
    container_name: airflow-init
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://admin:password123@postgres:5432/lake_metastore
      - _AIRFLOW_DB_UPGRADE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=airflow
      - _AIRFLOW_WWW_USER_PASSWORD=airflow
    networks:
      - lakehouse-net
    command: version

  airflow-webserver:
    image: apache/airflow:2.8.1
    container_name: airflow-webserver
    restart: always
    depends_on:
      - postgres
      - airflow-init
    ports:
      - "8082:8080"
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://admin:password123@postgres:5432/lake_metastore
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=true
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    networks:
      - lakehouse-net
    command: webserver

  airflow-scheduler:
    image: apache/airflow:2.8.1
    container_name: airflow-scheduler
    restart: always
    depends_on:
      - postgres
      - airflow-init
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://admin:password123@postgres:5432/lake_metastore
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    networks:
      - lakehouse-net
    command: scheduler

  # ==========================================
  # MLFLOW TRACKING SERVER (Usando Postgres)
  # ==========================================
  mlflow:
    image: python:3.10-slim
    container_name: mlflow-server
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5001:5000"
    environment:
      - MLFLOW_BACKEND_STORE_URI=postgresql://admin:password123@postgres:5432/lake_metastore
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=/mlflow/artifacts
    volumes:
      - ./mlflow_artifacts:/mlflow/artifacts
    networks:
      - lakehouse-net
    command: >
      bash -c "pip install mlflow psycopg2-binary && mlflow server --backend-store-uri postgresql://admin:password123@postgres:5432/lake_metastore --default-artifact-root /mlflow/artifacts --host 0.0.0.0 --port 5000"

  # ==========================================
  # APACHE KAFKA & ZOOKEEPER
  # ==========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks:
      - lakehouse-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - lakehouse-net

  # ==========================================
  # ELASTICSEARCH (Busca / Logs)
  # ==========================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - lakehouse-net

  # ==========================================
  # KIBANA
  # ==========================================
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.3
    container_name: kibana
    depends_on:
      - elasticsearch
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - xpack.security.enabled=false
    networks:
      - lakehouse-net

  # ==========================================
  # LOGSTASH
  # ==========================================
  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.3
    container_name: logstash
    depends_on:
      elasticsearch:
        condition: service_started
    ports:
      - "5044:5044"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
    networks:
      - lakehouse-net

  # ==========================================
  # PROMETHEUS (Para alimentar o Grafana)
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - lakehouse-net

  # ==========================================
  # GRAFANA (Dashboards e Métricas)
  # ==========================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - lakehouse-net

  # ==========================================
  # APACHE SPARK (Master / Driver base)
  # ==========================================
  spark-master:
    image: apache/spark:3.5.0
    container_name: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "8081:8080"
      - "7077:7077"
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    networks:
      - lakehouse-net

  # ==========================================
  # JUPYTER NOTEBOOK (PySpark + Iceberg)
  # ==========================================
  jupyter:
    build:
      context: ./jupyter
      dockerfile: Dockerfile
    container_name: jupyter-notebook
    depends_on:
      - spark-master
      - postgres
      - mysql
      - mssql
      - oracle
      - kafka
      - mlflow
    ports:
      - "8888:8888"
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - GRANT_SUDO=yes
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - ./notebooks:/home/jovyan/work
    networks:
      - lakehouse-net